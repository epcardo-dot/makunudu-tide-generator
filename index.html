<!DOCTYPE html>
<html>
<head>
    <title>Makunudu Tide Generator</title>
</head>
<body>

<h1>Makunudu Tide Generator</h1>

<label><b>Start Date:</b></label>
<input type="date" id="startDate">

<label><b>End Date:</b></label>
<input type="date" id="endDate">

<button onclick="generateChart()">Generate</button>

<hr>

<div id="result"></div>

<script>

const tideData = {

    "2026-06-07": {
        tide1: "5:00 AM High 0.48m",
        tide2: "10:55 AM Low 0.16m",
        tide3: "5:51 PM High 0.64m",
        tide4: "-",
        sunrise: "5:54 AM",
        sunset: "6:15 PM",
        moon: "Waning Gibbous 🌖"
    },

    "2026-06-08": {
        tide1: "12:31 AM Low 0.24m",
        tide2: "6:08 AM High 0.48m",
        tide3: "11:44 AM Low 0.24m",
        tide4: "6:27 PM High 0.60m",
        sunrise: "5:54 AM",
        sunset: "6:16 PM",
        moon: "Last Quarter 🌗"
    }

};

function generateChart() {

    let start = new Date(document.getElementById("startDate").value);
    let end = new Date(document.getElementById("endDate").value);

    let rows = "";

    let current = new Date(start);

    while(current <= end) {

        let key =
            current.getFullYear() + "-" +
            String(current.getMonth()+1).padStart(2,"0") + "-" +
            String(current.getDate()).padStart(2,"0");

        if(tideData[key]) {

            let d = tideData[key];

            rows += `
            <tr>
                <td>${key}</td>
                <td>${d.tide1}</td>
                <td>${d.tide2}</td>
                <td>${d.tide3}</td>
                <td>${d.tide4}</td>
                <td>${d.sunrise}</td>
                <td>${d.sunset}</td>
                <td>${d.moon}</td>
            </tr>
            `;
        }

        current.setDate(current.getDate()+1);
    }

    document.getElementById("result").innerHTML = `
        <h2>MAKUNUDU ISLAND</h2>
        <h3>TIDE CHART - KAAFU ATOLL (MALE)</h3>

        <table border="1" cellpadding="6">
            <tr>
                <th>Date</th>
                <th>1st Tide</th>
                <th>2nd Tide</th>
                <th>3rd Tide</th>
                <th>4th Tide</th>
                <th>Sunrise</th>
                <th>Sunset</th>
                <th>Moon Phase</th>
            </tr>

            ${rows}

        </table>
    `;
}

</script>

</body>
</html>
```
