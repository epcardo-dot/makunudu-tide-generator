<!DOCTYPE html>
<html>
<head>
    <title>Makunudu Tide Generator</title>
</head>
<body>

    <h1>Makunudu Tide Generator</h1>

    <label><b>Start Date:</b></label>
    <input type="date" id="startDate">

    <label><b>End Date:</b></label>
    <input type="date" id="endDate">

    <button onclick="generateChart()">Generate</button>

    <hr>

    <div id="result"></div>

    <script>
```javascript

    let end = document.getElementById("endDate").value;

        <table border="1" cellpadding="6">

                <th>Date</th>
                <th>1st Tide</th>
                <th>2nd Tide</th>
                <th>3rd Tide</th>
                <th>4th Tide</th>
                <th>Sunrise</th>
                <th>Sunset</th>
                <th>Moon Phase</th>
            </tr>

            <tr>
                <td>07 Jun 2026</td>
                <td style="color:blue;">5:00 AM High 0.48m</td>
                <td style="color:red;">10:55 AM Low 0.16m</td>
                <td style="color:blue;">5:51 PM High 0.64m</td>
                <td>-</td>
                <td>5:54 AM</td>
                <td>6:15 PM</td>
                <td>Waning Gibbous 🌖</td>
            </tr>

            <tr>
                <td>08 Jun 2026</td>
                <td style="color:red;">12:31 AM Low 0.24m</td>
                <td style="color:blue;">6:08 AM High 0.48m</td>
                <td style="color:red;">11:44 AM Low 0.24m</td>

                <td>5:54 AM</td>
                <td>6:16 PM</td>
                <td>Last Quarter 🌗</td>
            </tr>

        </table>
    `;
}
