<!DOCTYPE html>
<html>
<head>
    <title>Makunudu Tide Generator</title>
</head>

<body>

<h1>Makunudu Tide Generator</h1>

<label><b>Start Date:</b></label>
<input type="date" id="startDate">

<label><b>End Date:</b></label>
<input type="date" id="endDate">

<button onclick="generateChart()">Generate</button>

<hr>

<div id="result"></div>

<script>

function generateChart() {

    let start = new Date(document.getElementById("startDate").value);
    let end = new Date(document.getElementById("endDate").value);

    let rows = "";

    let current = new Date(start);

    while(current <= end) {

        let dateText = current.toLocaleDateString("en-GB", {
            day: "2-digit",
            month: "short",
            year: "numeric"
        });

        rows += `
        <tr>
            <td>${dateText}</td>
            <td style="color:blue;">High Tide</td>
            <td style="color:red;">Low Tide</td>
            <td style="color:blue;">High Tide</td>
            <td style="color:red;">Low Tide</td>
            <td>5:55 AM</td>
            <td>6:16 PM</td>
            <td>🌙 TBD</td>
        </tr>
        `;

        current.setDate(current.getDate() + 1);
    }

    document.getElementById("result").innerHTML = `
        <h2>MAKUNUDU ISLAND</h2>

        <h3>TIDE CHART - KAAFU ATOLL (MALE)</h3>

        <table border="1" cellpadding="6">
            <tr>
                <th>Date</th>
                <th>1st Tide</th>
                <th>2nd Tide</th>
                <th>3rd Tide</th>
                <th>4th Tide</th>
                <th>Sunrise</th>
                <th>Sunset</th>
                <th>Moon Phase</th>
            </tr>

            ${rows}

        </table>
    `;
}

</script>

</body>
</html>
