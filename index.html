<!DOCTYPE html>
<html>
<head>
    <title>Makunudu Tide Generator</title>
</head>
<body>

    <h1>Makunudu Tide Generator</h1>

    <label><b>Start Date:</b></label>
    <input type="date" id="startDate">

    <label><b>End Date:</b></label>
    <input type="date" id="endDate">

    <button onclick="generateChart()">Generate</button>

    <hr>

    <div id="result"></div>

    <script>
        function generateChart() {

            let start = document.getElementById("startDate").value;
            let end = document.getElementById("endDate").value;

            document.getElementById("result").innerHTML = `
                <h2>Makunudu Tide Chart</h2>

                <p><b>Start Date:</b> ${start}</p>
                <p><b>End Date:</b> ${end}</p>

                <table border="1" cellpadding="8">
                    <tr>
                        <th>Date</th>
                        <th>High Tide</th>
                        <th>Low Tide</th>
                    </tr>

                    <tr>
                        <td>07 Jun 2026</td>
                        <td style="color:blue;">0.48 m</td>
                        <td style="color:red;">0.16 m</td>
                    </tr>

                    <tr>
                        <td>08 Jun 2026</td>
                        <td style="color:blue;">0.51 m</td>
                        <td style="color:red;">0.20 m</td>
                    </tr>
                </table>
            `;
        }
    </script>

</body>
</html>
